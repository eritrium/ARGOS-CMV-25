<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b2a4a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Motoscafi">
    <script>try{var d=document.documentElement;if(localStorage.getItem('tema')==='chiaro')d.classList.add('chiaro');var f=localStorage.getItem('testo');if(f)d.style.fontSize=f+'%';}catch(e){}</script>
    <title>CONSORZIO MOTOSCAFI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- AVVISO NUOVA VERSIONE -->
<div id="avvisoAggiornamento">Sono disponibili nuovi aggiornamenti. Tocca qui per aggiornare</div>

<!-- 🔥 MESSAGGIO DI AVVISO -->
<div id="messaggioAvviso">
    -ARGOS FINO AL 16 NOVEMBRE - TABELLE SALUTE/APT FINO AL 14 NOVEMBRE-
</div>

<header><span class="tit">CONSORZIO MOTOSCAFI</span><small id="infoAggiornamento">VENEZIA</small></header>

        <input type="date" id="dataGlobale" aria-label="Scegli la data">
    </div>
    <button id="btnInstalla" type="button" hidden title="Installa l'app">📲</button>
    <button id="btnTesto" type="button" title="Ingrandisci il testo">A</button>

</div>

                <option value="226">226</option>

                <option value="236">236</option>
                <option value="238">238</option>
                <option value="245">245</option>
                <option value="252">252</option>
                <option value="254">254</option>
                <option value="259">259</option>
                <option value="263">263</option>
                <option value="265">265</option>
                <option value="303">303</option>
                <option value="307">307</option>
                <option value="311">311</option>
                <option value="317">317</option>
                <option value="322">322</option>
                <option value="351">351</option>
                <option value="355">355</option>
                <option value="356">356</option>
                <option value="364">364</option>
                <option value="366">366</option>
                <option value="370">370</option>
                <option value="383">383</option>
                <option value="N13">N13</option>
                <option value="N16">N16</option>
                <option value="N18">N18</option>
                <option value="N36">N36</option>
            </select>

            <input type="date" id="dataMotoscafo" hidden>

            <input type="text" id="filtroMotoscafo" placeholder="Cerca il numero (es. 15)" autocomplete="off">
            <div id="grigliaMotoscafi" class="griglia-num"></div>

            <button id="verificaTutti" type="button">Tutti i motoscafi</button>

            <button type="button" class="mic mic-largo" data-per="filtroMotoscafo">🎤 Dì «tredici domani»</button>

            <div id="outputMotoscafo"></div>
        </div>
    </div>

    <div class="accordion-section" id="sezioneSaluteApt">
        <div class="section-box">
            <input type="date" id="dataServizio" hidden>

            <button type="button" class="mic mic-largo" data-per="servizi">🎤 Dì «apt domani»</button>

            <div class="seg" id="segServizio">
                <button type="button" data-s="APT">APT</button>
                <button type="button" data-s="SALUTE">SALUTE</button>
                <button type="button" data-s="BOTH">APT + SALUTE</button>
            </div>

            <button id="condividiEntrambe" type="button">Condividi APT + SALUTE (immagine)</button>

            <div id="outputServizio"></div>
        </div>
    </div>

    <div class="accordion-section" id="sezioneTariffe">
        <div class="section-box">
            <select id="hotelSelect">

                <option value="MONACO">MONACO</option>
                <option value="ORIENT EXPRESS">ORIENT EXPRESS</option>
                <option value="PALAZZETTO MADONNA">PALAZZETTO MADONNA</option>
                <option value="PALAZZO BARBARIGO">PALAZZO BARBARIGO</option>
                <option value="PALAZZO KELLER">PALAZZO KELLER</option>
                <option value="PANORAMA">PANORAMA</option>
                <option value="PAUSANIA">PAUSANIA</option>
                <option value="VIKTORIA PALACE">VIKTORIA PALACE</option>
                <option value="RIALTO">RIALTO</option>
            </select>

            <button type="button" class="mic mic-largo" data-per="filtroHotel">🎤 Dì «Gritti»</button>

            <input type="text" id="filtroHotel" placeholder="Cerca l'hotel (es. gri)" autocomplete="off">
            <div id="grigliaHotel" class="hotel-grid"></div>

            <div id="risultatiTariffe"></div>
        </div>
    </div>

</main>

<div id="suggerimentoHome" class="hint" hidden style="text-align:center">Per averla sulla Home: tocca Condividi e poi «Aggiungi alla schermata Home».</div>

<nav class="nav" id="nav">
    <button type="button" class="tab btn-argos" id="toggleArgos">ARGOS</button>
    <button type="button" class="tab btn-salute" id="toggleSaluteApt">SALUTE / APT</button>
    <button type="button" class="tab btn-tariffe" id="toggleTariffe">TARIFFE</button>
</nav>

<script src="script.js"></script>

</body>
</html>
